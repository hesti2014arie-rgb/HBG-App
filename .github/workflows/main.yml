
name: HBG Android APK Builder

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP project tidak ditemukan!"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Gradle project
        run: |
          SETTINGS=$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan dalam ZIP!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HBG-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
